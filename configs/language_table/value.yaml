features: data/language_table/{task}/radio_h.h5
output_dir: checkpoints/language_table/{task}/value
seed: 0

batch_size: 64
num_workers: 2
steps: 97500
lr: 1.0e-4
weight_decay: 0.01
grad_clip: 1.0
gamma: 0.95
expectile: 0.75
target_tau: 0.005
log_every: 100
save_every: 2500

model:
  history_len: 2
  hidden_dim: 256
  token_dim: 512
  temporal_nhead: 8
  temporal_layers: 2
  temporal_dropout: 0.1
  language_hidden_mult: 2
  value_mlp_hidden_mult: 2
