data: data/pusht/PushT.h5
stats: data/pusht/PushT_stats.json
radio_features: data/pusht/radio_h_96.h5
goal_features: data/pusht/subgoal_features
views: [image, image]
state_keys: [state, state]
output_dir: checkpoints/pusht/policy
seed: 0

batch_size: 32
num_workers: 8
max_steps: 150000
cosine_steps: 200000
warmup_steps: 2000
lr: 3.0e-4
weight_decay: 0.01
no_weight_decay: []
grad_clip: 1.0
task_aux_weight: 0.0
log_every: 100
save_every: 25000

augment:
  crop_prob: 0.0
  crop_scale: [0.7, 1.0]
  state_noise: 0.02

model:
  state_dim: 10
  action_dim: 2
  history_len: 2
  action_chunk_len: 16
  num_views: 2
  d_model: 512
  nhead: 8
  num_layers: 10
  dim_feedforward: 2048
  dropout: 0.1
  radio_local_dim: 1280
  radio_summary_dim: 3840
  radio_patch_tokens: 36
  goal_sequence_len: 3
  goal_latent_tokens: 4
  goal_perceiver_layers: 2
  goal_drop_prob: 0.1
  language_drop_prob: 0.0
