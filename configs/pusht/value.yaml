data: data/pusht/PushT.h5
features: data/pusht/radio_b_96.h5
output_dir: checkpoints/pusht/value
seed: 0
val_fraction: 0.1

batch_size: 512
num_workers: 4
steps: 10000
lr: 1.0e-4
weight_decay: 0.01
grad_clip: 1.0
gamma: 0.95
expectile: 0.75
target_tau: 0.005
log_every: 100
save_every: 2500

model:
  history_len: 2
  hidden_dim: 128
  state_token_dim: 256
  temporal_nhead: 4
  temporal_layers: 2
  temporal_dropout: 0.1
  goal_bottleneck_dim: 256
  goal_mlp_hidden_mult: 2
  lang_embed_dim: 64
  lang_gru_hidden: 128
  value_mlp_hidden_mult: 2
